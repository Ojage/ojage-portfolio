# Deploy the Ojage portfolio to the shared NNACT VPS.
#
# The portfolio is a static CRA build, so this pipeline does not use Docker and
# does not run anything on the VPS: it builds the bundle in CI, publishes it
# atomically with rsync, and verifies the result. Caddy (already on this host)
# serves the directory, so there is no application process to restart and a
# deploy cannot take a service down.
#
# Why rsync and not a git checkout on the server: the build is reproducible in
# CI, so shipping artifacts is faster than building on the VPS, and it means the
# published bytes are exactly the ones CI tested.
#
# Secrets required (repository settings):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY   — reused from the NNACT Pro deploy
#   DEPLOY_PATH                                — the NNACT checkout on the VPS
#   OJAGE_PORTFOLIO_ROOT                        — absolute document root on the VPS
# If DEPLOY_PATH is not set as a secret, the default below matches this server.

name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Never cancel a deploy that is mid-publish: the rsync
# swap is atomic per-file, and interrupting it can leave a half-updated bundle.
concurrency:
  group: ojage-portfolio-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Fail fast on a broken build. Nothing reaches the server unless CI is green.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.1.0
        with:
          node-version: "24"
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Type check
        # CRA exposes no `tsc` script, so call the binary directly. Fails the
        # pipeline on a type error before anything is built or published.
        run: npx --no-install tsc --noEmit

      - name: Build
        env:
          # Any future runtime config for the bundle goes here, so it is visible
          # in the workflow rather than hidden in the app.
          CI: "true"
        run: yarn build

      - name: Verify the SPA shell exists
        # A build that produces no index.html would otherwise deploy cleanly and
        # serve a 404, so assert the artifact before publishing.
        run: |
          set -euo pipefail
          test -f build/index.html || { echo "build/index.html missing" >&2; exit 1; }
          test -d build/static || { echo "build/static missing" >&2; exit 1; }
          echo "artifact verified:"
          du -sh build
          ls build

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: portfolio-build
          path: build
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Publish to VPS
    # Only a green build may publish. This is the guard that keeps a broken
    # commit from taking the live site down.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Download artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: portfolio-build
          path: build

      - name: Publish build to the document root
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          OJAGE_PORTFOLIO_ROOT: ${{ vars.OJAGE_PORTFOLIO_ROOT || 'data/ojage-portfolio' }}
          OJAGE_PORTFOLIO_ADDRESS: ${{ vars.OJAGE_PORTFOLIO_ADDRESS || 'salathiel.ojage.org' }}
        run: |
          set -euo pipefail
          HOST="${DEPLOY_USER}@${DEPLOY_HOST}"
          OPTS=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10)
          DEPLOY_PATH="${DEPLOY_PATH:-/srv/nnact-pro}"
          # Written to disk next to the NNACT checkout so the path is
          # self-documenting for whoever inspects the VPS next.
          TARGET="${DEPLOY_PATH}/${OJAGE_PORTFOLIO_ROOT}"

          # Caddy bind-mounts TARGET, and a bind mount follows the inode it was
          # created with. Replacing TARGET itself (mv a fresh directory into
          # place) therefore leaves Caddy bound to the old, now-empty inode
          # while the new build sits on disk unreferenced — which is exactly
          # how the first deploy shipped a 404. So TARGET is created once and
          # never replaced: builds land in releases/<stamp>/ and a "current"
          # symlink inside TARGET is repointed instead. The symlink is what
          # Caddy's root resolves through.
          ssh "${OPTS[@]}" "$HOST" "mkdir -p '${TARGET}/releases'"

          STAMP=$(date -u +%Y%m%d%H%M%S)
          RELEASE="${TARGET}/releases/${STAMP}"

          # Upload to a temporary name, then rename within the same filesystem so
          # the release directory only ever appears complete.
          ssh "${OPTS[@]}" "$HOST" "rm -rf '${RELEASE}.tmp' && mkdir -p '${RELEASE}.tmp'"

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            build/ \
            "${HOST}:${RELEASE}.tmp/"

          # Point "current" at the new release atomically (ln -sfn + mv -T on
          # the link), so a request either sees the whole old build or the whole
          # new one, never a mix.
          ssh "${OPTS[@]}" "$HOST" "
            set -e
            mv '${RELEASE}.tmp' '${RELEASE}'
            ln -sfn 'releases/${STAMP}' '${TARGET}/current.new'
            mv -Tf '${TARGET}/current.new' '${TARGET}/current'
            # Deploy metadata lives outside releases/ so it is never served.
            echo \"\$(date -u +%FT%TZ) ${GITHUB_SHA} ${STAMP}\" > '${TARGET}/deployed-at'
            # Keep the last few releases for rollback; drop the rest.
            ls -1dt '${TARGET}'/releases/*/ 2>/dev/null | tail -n +4 | xargs -r rm -rf
            echo \"current -> \$(readlink '${TARGET}/current')\"
          "

          # Confirm Caddy is serving *this* build, not merely that something
          # answered on 443. The main bundle is content-hashed, so its filename
          # is a fingerprint: if the live index.html references the hash we just
          # built, the new code is genuinely being served. A plain status check
          # would pass even against a stale document root or a wrong vhost.
          echo "=== verifying published site ==="
          LOCAL_BUNDLE=$(basename "$(grep -oE '/static/js/main\.[a-f0-9]+\.js' build/index.html | head -1)")
          echo "published bundle: ${LOCAL_BUNDLE}"

          HTTP=$(curl -sS -o /tmp/ojage-index.html -w '%{http_code}' \
            "https://${OJAGE_PORTFOLIO_ADDRESS}/" || echo "000")
          echo "https://${OJAGE_PORTFOLIO_ADDRESS}/ -> ${HTTP}"

          if [ "$HTTP" = "000" ]; then
            echo "The build was published, but the site is unreachable." >&2
            echo "Check that the DNS A record for ${OJAGE_PORTFOLIO_ADDRESS} points at this host." >&2
            exit 1
          fi
          if [ "$HTTP" -ge 500 ]; then
            echo "Caddy returned a server error for the published site." >&2
            exit 1
          fi
          if ! grep -qF "${LOCAL_BUNDLE}" /tmp/ojage-index.html; then
            echo "Caddy is serving a DIFFERENT build than the one just published." >&2
            echo "Expected ${LOCAL_BUNDLE} in the live index.html. Check the vhost root and that" >&2
            echo "Caddy was recreated after the compose change (docker compose up -d caddy)." >&2
            exit 1
          fi
          echo "deploy verified: ${GITHUB_SHA} serving ${LOCAL_BUNDLE}"
